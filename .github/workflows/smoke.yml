name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      client-ref:
        description: Matching skimasque client commit or branch
        default: main
        type: string

permissions:
  contents: read

jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm test
      - name: Validate action metadata
        if: runner.os == 'Linux'
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/skm-metadata" yaml@2.8.1 ajv@8.17.1
          curl --fail --location https://json.schemastore.org/github-action.json -o "$RUNNER_TEMP/action.schema.json"
          node test/validate-metadata.cjs "$RUNNER_TEMP/skm-metadata/node_modules" "$RUNNER_TEMP/action.schema.json" action.yml test/post-audit/action.yml

  networking:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: skimasque-dev/skimasque
          ref: ${{ inputs.client-ref || vars.SKIMASQUE_CLIENT_REF || 'main' }}
          path: client-source
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: rustup toolchain install 1.88.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            client-source/target
          key: networking-${{ runner.os }}-${{ hashFiles('client-source/Cargo.lock') }}
      - run: cargo +1.88.0 build --locked -p skimasque-cli
        working-directory: client-source
      - name: Download and verify adapter
        run: |
          mkdir -p .test-bin
          node -e 'require("./src/install.cjs").installAdapter({platform:"linux",arch:"x64"},".test-bin").then(console.log).catch(e=>{console.error(e);process.exitCode=1})'
      - run: docker build -t skimasque-network-tests -f test/linux/Dockerfile .
      - name: Verify real private networking in disposable isolated namespaces
        run: |
          docker run --rm --privileged \
            -v "$PWD:/action:ro" \
            -e SKIMASQUE_CLIENT_BIN=/action/client-source/target/debug/skimasque-client \
            -e SKIMASQUE_SERVER_BIN=/action/client-source/target/debug/skimasque-server \
            -e SKIMASQUE_ADAPTER_BIN=/action/.test-bin/adapter/tun2socks-linux-amd64 \
            skimasque-network-tests node --test /action/test/linux/networking.test.cjs

  action-post:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: skimasque-dev/skimasque
          ref: ${{ inputs.client-ref || vars.SKIMASQUE_CLIENT_REF || 'main' }}
          path: client-source
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: cargo build --locked -p skimasque-cli
        working-directory: client-source
      - name: Start local OIDC gateway and HTTP origin
        run: |
          mkdir -p "$RUNNER_TEMP/skm-post-audit"
          client-source/target/debug/skimasque-server \
            --listen 127.0.0.1:4433 --authority localhost:4433 \
            --self-signed-name localhost --write-cert "$RUNNER_TEMP/skm-post-audit/ca.pem" \
            --oidc --oidc-audience skimasque-action-ci --allow-private \
            > "$RUNNER_TEMP/skm-post-audit/gateway.log" 2>&1 &
          python3 -m http.server 18080 --bind 127.0.0.1 > "$RUNNER_TEMP/skm-post-audit/origin.log" 2>&1 &
          for i in $(seq 1 100); do
            test -s "$RUNNER_TEMP/skm-post-audit/ca.pem" && break
            sleep 0.1
          done
          test -s "$RUNNER_TEMP/skm-post-audit/ca.pem"
      # Register first: GitHub runs post hooks in reverse registration order.
      - uses: ./test/post-audit
      - uses: ./
        id: network
        with:
          mode: proxy
          proxy: 127.0.0.1:4433
          authority: localhost:4433
          audience: skimasque-action-ci
          ca: ${{ runner.temp }}/skm-post-audit/ca.pem
          client-bin: ${{ github.workspace }}/client-source/target/debug/skimasque-client
          http-listen: 127.0.0.1:0
          listen: 127.0.0.1:0
          probe-target: 127.0.0.1:18080
      - name: Verify ordinary HTTP through exported proxy
        run: curl --fail --noproxy '' http://127.0.0.1:18080/
      - name: Give post audit the ownership manifest
        if: always()
        env:
          STATE_FILE: ${{ steps.network.outputs.state-file }}
        run: printf '%s' "$STATE_FILE" > "$RUNNER_TEMP/skm-post-audit/manifest-path"
