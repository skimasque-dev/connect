name: skimasque connect
description: Identity-bound access through a MASQUE gateway with transparent Linux routing or HTTP/SOCKS proxies.
branding:
  icon: shield
  color: purple
inputs:
  proxy:
    description: Gateway address, host:port.
    required: true
  audience:
    description: OIDC audience matching a gateway --oidc-audience value.
    required: true
  mode:
    description: "transparent (dedicated Ubuntu with TUN and resolved) or proxy (HTTP/SOCKS-aware tools). Unsupported transparent runners fail; select proxy explicitly."
    default: transparent
  routes:
    description: Comma/newline-separated private IPv4/IPv6 CIDRs. Required in transparent mode; default and local routes are rejected.
  dns-servers:
    description: Comma/newline-separated private DNS server IPs. Required in transparent mode and routed through the tunnel.
  dns-domains:
    description: "Comma/newline-separated private DNS domains, e.g. ~internal.example. Required in transparent mode. ~. is rejected."
  authority:
    description: Gateway TLS server name and HTTP authority. Defaults to the original proxy hostname.
    default: ""
  application:
    description: Application context sent as X-Masque-Application.
    default: ""
  ca:
    description: Path to the gateway certificate authority PEM.
    default: ""
  listen:
    description: Loopback SOCKS5 listener address; port 0 selects a free port.
    default: "127.0.0.1:1080"
  http-listen:
    description: Loopback HTTP/HTTPS proxy listener address; port 0 selects a free port.
    default: "127.0.0.1:8080"
  version:
    description: skimasque-client release tag. A moving ref resolves to the latest release; old clients without dual-proxy capabilities fail.
    default: ""
  repository:
    description: Repository containing skimasque client release artifacts.
    default: skimasque-dev/skimasque
  client-bin:
    description: Use this existing client binary; capability checks still apply.
    default: ""
  probe-target:
    description: Optional host:port to verify real TCP connectivity before reporting readiness.
    default: ""
  startup-timeout:
    description: Client startup timeout in seconds (1 through 300).
    default: "30"
outputs:
  mode:
    description: Selected networking mode.
  http-proxy:
    description: Explicit local HTTP proxy URL. Transparent mode does not export global proxy variables.
  socks-proxy:
    description: Explicit local SOCKS5 URL using gateway-side hostname resolution.
  state-file:
    description: Ownership manifest path for diagnostics and explicit early cleanup using src/stop.cjs.
runs:
  using: node24
  main: src/main.cjs
  post: src/post.cjs
  post-if: always()
